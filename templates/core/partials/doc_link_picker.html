<!-- HTMX partial: rendered inside #link-modal-container on prospect_detail.html -->
<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50" id="link-picker-modal">
  <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full mx-4 p-6">
    <div class="flex items-center justify-between mb-1">
      <h3 class="text-lg font-semibold">Link Documents</h3>
      <button onclick="document.getElementById('link-modal-container').innerHTML=''"
              class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <p class="text-sm text-gray-500 mb-4">Select one or more documents to attach to this prospect.</p>

    <form hx-post="{% url 'create_doc_link' %}"
          hx-target="#linked-documents"
          hx-swap="outerHTML"
          hx-on::after-request="document.getElementById('link-modal-container').innerHTML=''"
          method="post">
      {% csrf_token %}
      <input type="hidden" name="content_type_label" value="{{ content_type_label }}">
      <input type="hidden" name="object_id" value="{{ object_id }}">

      <!-- Select all toggle -->
      <div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-100">
        <input type="checkbox" id="doc-select-all"
               class="rounded border-gray-300 text-cyan-600 cursor-pointer">
        <label for="doc-select-all" class="text-xs text-gray-500 cursor-pointer select-none">Select all</label>
        <span id="doc-selected-count" class="ml-auto text-xs text-gray-400"></span>
      </div>

      <div class="max-h-72 overflow-y-auto divide-y divide-gray-100 mb-4">
        {% for doc in documents %}
        <label class="flex items-center gap-3 py-2.5 px-1 hover:bg-gray-50 cursor-pointer rounded">
          <input type="checkbox" name="document_id" value="{{ doc.pk }}"
                 class="doc-checkbox rounded border-gray-300 text-cyan-600 cursor-pointer flex-shrink-0">
          <div class="min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate">{{ doc.title }}</p>
            <p class="text-xs text-gray-400">
              {% if doc.doc_type %}{{ doc.doc_type }} · {% endif %}{{ doc.created_at|date:"M d, Y" }}
            </p>
          </div>
        </label>
        {% empty %}
          <p class="py-4 text-sm text-gray-400 text-center">No documents available to link.</p>
        {% endfor %}
      </div>

      <div class="flex justify-end gap-3">
        <button type="button"
                onclick="document.getElementById('link-modal-container').innerHTML=''"
                class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">
          Cancel
        </button>
        <button type="submit"
                class="px-4 py-2 bg-cyan-600 text-white rounded-lg text-sm hover:bg-cyan-700 font-medium">
          Link Selected
        </button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  const checkboxes = document.querySelectorAll('.doc-checkbox');
  const selectAll  = document.getElementById('doc-select-all');
  const countSpan  = document.getElementById('doc-selected-count');

  function updateCount() {
    const n = [...checkboxes].filter(c => c.checked).length;
    countSpan.textContent = n > 0 ? `${n} selected` : '';
    selectAll.indeterminate = n > 0 && n < checkboxes.length;
    selectAll.checked = checkboxes.length > 0 && n === checkboxes.length;
  }

  checkboxes.forEach(cb => cb.addEventListener('change', updateCount));
  selectAll.addEventListener('change', () => {
    checkboxes.forEach(cb => { cb.checked = selectAll.checked; });
    updateCount();
  });
})();
</script>
