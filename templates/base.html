{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OreFox KMS</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="flex min-h-screen">
    {% include "core/partials/sidebar.html" %}
    <main class="flex-1 p-6 bg-gray-50{% block main_extra_class %}{% endblock %}">
      {% if messages %}
      <div class="mb-4 space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-lg text-sm font-medium
          {% if message.tags == 'success' %}bg-green-50 border border-green-200 text-green-700
          {% elif message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700
          {% elif message.tags == 'warning' %}bg-yellow-50 border border-yellow-200 text-yellow-700
          {% else %}bg-blue-50 border border-blue-200 text-blue-700{% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
